[project]
name = "fslib"
version = "0.1.0"
description = "Библиотека для работы с регулярными выражениями и конечными автоматами"
requires-python = ">=3.10"
dependencies = ["fire>=0.5"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
viz = ["graphviz"]

[project.scripts]
fslib = "fslib.cli:main"